         renders client-side, and social scrapers (Slack, iMessage, X,
         LinkedIn, Facebook) don't run JS, so anything Svelte injects on
         mount is invisible to them. Keep this in sync with App.svelte. -->

    <script>
      // Applied before paint so a stored dark/light override doesn't
      // flash the system-default theme first.
      try {
        var stored = localStorage.getItem('theme-preference');
        if (stored === 'light' || stored === 'dark') {
          document.documentElement.setAttribute('data-theme', stored);
        }
      } catch (e) {}
    </script>
